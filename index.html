<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mellow</title>
    <meta name="description" content="A minimalist offline vocabulary app.">
    <meta name="theme-color" content="#FBFDFF">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mellow">
    <meta name="format-detection" content="telephone=no">

    <link rel="icon" type="image/png" sizes="16x16" href="img/icons/16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/icons/32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="img/icons/48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icons/180.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preload" href="fonts/comfortaa-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="loader" id="loader">
        <div class="loader-cards">
            <div class="loader-card loader-card-a"><span>📚</span><small data-t="loader.simple">Simple</small></div>
            <div class="loader-card loader-card-b"><span>💭</span><small data-t="loader.learning">Learning</small></div>
            <div class="loader-card loader-card-c"><span>✨</span><small>Mellow</small></div>
        </div>
        <div class="loader-text">
            <span class="muted" data-t="loader.welcome">welcome to</span>
            <span class="loader-brand gradient-text">Mellow</span>
        </div>
        <div class="loader-footer">
            <span data-t="loader.created">Created by</span> <strong class="gradient-text">fovae</strong><br>
            <span data-t="loader.rights">All rights reserved.</span>
        </div>
    </div>

    <main class="main" id="main"></main>
    <div class="tab-bar-wrap"><nav class="tab-bar" id="tabBar"></nav></div>
</body>
</html>
