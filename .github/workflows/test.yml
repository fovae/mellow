name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.mjs
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: tests/e2e
      - run: npm test 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
        shell: bash
        working-directory: tests/e2e
        env:
          BROWSER: ${{ matrix.browser }}
      # Failures as one annotation: annotations are readable without signing in, logs are not.
      - if: failure()
        shell: bash
        working-directory: tests/e2e
        run: |
          summary=$(grep -vE '^\s+at ' e2e.log | grep -E -A14 '^✖|^ *not ok' | head -150 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } 1')
          echo "::error title=Browser tests (${{ matrix.browser }})::${summary}"
